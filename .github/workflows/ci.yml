name: Security and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release scripts and property lists
        run: |
          for script in scripts/*.sh; do zsh -n "$script"; done
          plutil -lint Resources/Info.plist Resources/LumaPulse.entitlements
      - name: Functional, adversarial input, update, and report checks
        run: zsh scripts/test.sh
      - name: Build sandboxed app and inspect hardening
        run: zsh scripts/build.sh
      - name: Verify sandbox file isolation
        run: dist/LumaPulse.app/Contents/MacOS/LumaPulse --sandbox-smoke
