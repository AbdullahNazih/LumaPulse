name: Bug report
description: Report a reproducible problem without credentials or private data
body:
  - type: input
    id: version
    attributes:
      label: LumaPulse and macOS versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result, and actual result
      description: Never include API keys, authenticated URLs, or account details.
    validations:
      required: true
